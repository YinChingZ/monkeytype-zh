<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Monkeytype 中文释义</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div><span class="eyebrow">MONKEYTYPE · 中文释义</span><h1>你的打字，你的样式。</h1></div><label class="switch" title="显示中文释义"><input id="enabled" type="checkbox" aria-label="显示中文释义"><span></span></label></header>
<p class="intro">跟随网站外观，或调整成你习惯的样子。</p>
<main>
<section><h2>配色与字体</h2>
<label>配色<select id="theme"><option value="follow">跟随 Monkeytype</option><option value="dark">独立深色</option><option value="light">独立浅色</option></select></label>
<label>字体<select id="fontFamily"><option value="follow">跟随 Monkeytype</option><option value="system">系统黑体</option><option value="serif">衬线 / 宋体</option><option value="mono">等宽字体</option></select></label>
<label>字号模式<select id="sizeMode"><option value="custom">自定义字号</option><option value="follow">跟随 Monkeytype</option></select></label>
<label>释义字号 <span class="unit"><input id="fontSize" type="number" min="12" max="48" step="1" aria-label="释义字号"> px</span></label>
<label>显示音标<input id="phonetic" type="checkbox"></label>
</section>
<section><h2>位置与布局</h2>
<label>放置位置<select id="position"><option value="below">练习区下方</option><option value="above">练习区上方</option><option value="bottom">固定屏幕底部</option><option value="top">固定屏幕顶部</option></select></label>
<label>水平对齐<select id="align"><option value="left">靠左</option><option value="center">居中</option><option value="right">靠右</option></select></label>
<div class="pair"><label>水平偏移<input id="offsetX" type="number" min="-400" max="400" step="4"></label><label>垂直偏移<input id="offsetY" type="number" min="-300" max="300" step="4"></label></div>
<p class="hint">单位 px。正数向右 / 下，负数向左 / 上。</p>
<div class="pair"><label>区域间距<input id="gap" type="number" min="0" max="80" step="2"></label><label>面板宽度<input id="width" type="number" min="240" max="800" step="20"></label></div>
<label>最多显示行数<select id="maxLines"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
</section>
<section><h2>面板细节</h2>
<div class="checks"><label>背景<input id="background" type="checkbox"></label><label>边框<input id="border" type="checkbox"></label><label>阴影<input id="shadow" type="checkbox"></label></div>
<label>背景不透明度 <output id="opacityValue" for="backgroundOpacity">95%</output></label><input id="backgroundOpacity" type="range" min="0" max="100" step="5" aria-label="背景不透明度">
<p class="hint">关闭背景与边框，可只保留文字。中文使用可用的中文字体补全。</p>
</section>
</main><footer><button id="reset" type="button">重置外观</button><span id="status" role="status">修改即时生效 · 自动保存</span></footer><script src="settings.js"></script><script src="popup.js"></script></body></html>
